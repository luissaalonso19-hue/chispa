<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chispa (Copy)</title>
<style>
:root{--bg:#eef4ff;--ink:#0d1b3a;--soft:#5a6b8c;--card:#fff;--acc:#1e6bff;--g:linear-gradient(135deg,#19b5ff,#2a4bff);--line:rgba(13,27,58,.1);--sh:0 6px 24px rgba(20,70,180,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071228;--ink:#eaf1ff;--soft:#93a8d1;--card:#0e2048;--line:rgba(234,241,255,.13);--sh:0 6px 24px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#071228;--ink:#eaf1ff;--soft:#93a8d1;--card:#0e2048;--line:rgba(234,241,255,.13);--sh:0 6px 24px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow-y:auto;padding-bottom:80px}
.view.on{display:block}
#v-vid{scroll-snap-type:y mandatory;background:#000;padding:0;scrollbar-width:none}
.vid{height:100%;scroll-snap-align:start;position:relative;background:#000}
.vid video{width:100%;height:100%;object-fit:cover}
.ov{position:absolute;left:16px;right:80px;bottom:24px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:6px}
.ov b{cursor:pointer}
.side{position:absolute;right:10px;bottom:30px;display:flex;flex-direction:column;gap:14px;align-items:center}
.ib{background:none;border:0;color:inherit;font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:44px;min-height:44px;justify-content:center}
.ib span{font-size:30px;line-height:1}
.vid .ib{color:#fff;text-shadow:0 1px 6px #000}
nav{display:flex;margin:6px 14px 10px;border-radius:26px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);box-shadow:var(--sh);border:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--soft);font:inherit;font-size:11px;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;border-radius:26px}
nav button span{font-size:21px}
nav button.on{color:var(--acc);font-weight:800}
.fab{position:absolute;right:16px;bottom:14px;width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;border:0;font-size:28px;cursor:pointer;box-shadow:0 8px 20px rgba(30,107,255,.45);z-index:3}
.logo{font-size:26px;font-weight:900;padding:14px 18px 4px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--g);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none;overflow:hidden;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.rg{padding:2.5px;border-radius:50%;background:conic-gradient(#19e0ff,#1e6bff,#5b4bff,#19e0ff);display:inline-flex;flex:none}
.rg .av{border:2.5px solid var(--bg)}
.stories{display:flex;gap:12px;padding:10px 14px 14px;overflow-x:auto;scrollbar-width:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;cursor:pointer;background:none;border:0;color:var(--ink);font-family:inherit;min-width:66px}
.st .av{width:58px;height:58px}
.st .rg .av{border-color:var(--bg)}
.st.add .rg{background:var(--line)}
.card{margin:10px 14px;padding:14px;border-radius:22px;background:var(--card);box-shadow:var(--sh)}
.hd{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.hd b{cursor:pointer}.hd small{color:var(--soft);font-weight:400}
.card img.ph{width:100%;border-radius:16px;display:block}
.card p{font-size:16px;line-height:1.45;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.act{display:flex;gap:6px;margin-top:6px}
.act .ib{flex-direction:row;gap:6px;color:var(--ink);font-size:14px;min-height:40px}
.act .ib span{font-size:22px}
.empty{padding:40px 24px;text-align:center;color:var(--soft);line-height:1.5}
.page{padding:8px 14px}
h2{font-size:22px}
input[type=text],input[type=email],input[type=password]{width:100%;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:12px}
textarea{width:100%;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:12px;resize:none;height:110px}
.btn{background:var(--g);color:#fff;border:0;border-radius:99px;padding:11px 22px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;min-height:44px}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.red{background:#e5383b}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.prof{display:flex;gap:16px;align-items:center;margin:8px 0 14px}
.prof .av{width:84px;height:84px;font-size:32px}
.stats{display:flex;gap:20px;margin-top:6px}.stats div{font-size:12px;color:var(--soft)}.stats b{display:block;font-size:18px;color:var(--ink)}
.tabs{display:flex;background:var(--card);border-radius:16px;padding:4px;margin:14px 0;box-shadow:var(--sh)}
.tabs button{flex:1;border:0;background:none;color:var(--soft);font:inherit;font-weight:700;font-size:14px;padding:10px 0;border-radius:12px;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{aspect-ratio:3/4;border-radius:14px;overflow:hidden;position:relative;background:var(--card);cursor:pointer}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}
.card .chip{position:static;display:inline-block;margin-bottom:6px}
.tact{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(0,0,0,.55)}
.mb{flex:1;background:none;border:0;color:#fff;font-size:18px;min-height:40px;cursor:pointer}
.card .tact{position:static;background:none;margin-top:6px;gap:8px}
.card .mb{background:var(--bg);color:var(--ink);border-radius:12px;font-size:15px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:88%;overflow-y:auto}
.sheet img,.sheet video{width:100%;border-radius:14px;max-height:65vh;object-fit:contain;background:#000}
#sv{position:absolute;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center;color:#fff}
#sv.on{display:flex}
#sv img{max-width:100%;max-height:100%}
#sv .top{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;align-items:center;gap:10px;font-weight:700;text-shadow:0 1px 6px #000}
#sv .bar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:14px;right:14px;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
#sv .bar i{display:block;height:100%;width:0;background:#fff}
#sd{margin-left:auto;background:rgba(0,0,0,.5);border:0;color:#fff;font-size:20px;border-radius:50%;width:44px;height:44px;cursor:pointer}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:30;max-width:90%}
#gate{position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;line-height:1.5}
#auth{position:absolute;inset:0;background:var(--bg);z-index:35;display:none;overflow-y:auto;padding:28px 22px}#auth .logo{padding:0 0 10px}#auth input{margin-bottom:10px}#auth .msg{color:#e5383b;font-size:14px;min-height:20px;margin-bottom:6px}.lnk{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;min-height:44px;width:100%}
#cr{position:absolute;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column;align-items:center;padding:24px 20px;gap:16px}#cr.on{display:flex}.cbox{width:min(80vw,300px);aspect-ratio:1;position:relative;overflow:hidden;border-radius:50%;touch-action:none;background:#000;cursor:grab;box-shadow:0 0 0 4px var(--acc)}.cbox img{position:absolute;max-width:none;user-select:none;pointer-events:none}input[type=range]{accent-color:var(--acc);min-height:44px}.stats .sb{background:none;border:0;font:inherit;font-size:12px;color:var(--soft);text-align:left;cursor:pointer;min-height:44px;padding:0}.lrow{display:flex;align-items:center;gap:12px;padding:8px 0}.lrow b{flex:1;cursor:pointer}.lrow .btn{padding:8px 16px;font-size:14px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}.car img{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;display:block}.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 4px}.th{position:relative;flex:none}.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}.th button{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:12px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <div id="gate"><div><div class="logo" style="margin:auto">Chispa</div><p id="gmsg">Conectando…</p></div></div>
 <div id="auth"></div>
 <div id="cr"></div>
 <input id="pf" type="file" accept="image/*" hidden>
 <main>
  <section id="v-vid" class="view on"></section>
  <section id="v-pho" class="view"></section>
  <section id="v-txt" class="view"></section>
  <section id="v-me" class="view"></section><section id="v-inb" class="view"></section>
  <button class="fab" id="fab" aria-label="Crear">＋</button>
  <div class="modal" id="md"><div class="sheet" id="sh"></div></div>
  <div id="sv"><div class="bar"><i id="sb"></i></div><div class="top"><span id="sa"></span><span id="sn"></span><button id="sd" aria-label="Eliminar story" hidden>🗑</button></div><img id="si" alt="Story"></div>
  <div id="toast"></div>
 </main>
 <nav>
  <button class="on" data-v="vid"><span>🎬</span>Vídeos</button>
  <button data-v="pho"><span>📷</span>Fotos</button>
  <button data-v="txt"><span>💬</span>Texto</button>
  <button data-v="inb"><span>🔔</span>Bandeja</button><button data-v="me"><span>👤</span>Perfil</button>
 </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://iyxwluabjviakrjgwstw.supabase.co",SB_KEY="sb_publishable_YUzTd7uaaVVOZGb7YWXsmw_dr3ibR_E";
const $=id=>document.getElementById(id);
const esc=t=>{const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML};
let curList=null,db,user,assets,ou,uid=null,canW=false,tab="vid",pu=null,ptab="vid";
const D={cm:[],nt:[],dm:[],rq:[],rr:[],vid:[],pho:[],txt:[],sto:[],mine:[],lk:{},pr:{},fl:{},accs:[],opr:{},ofl:{}};
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?"ahora":m<60?m+" min":m<1440?Math.floor(m/60)+" h":Math.floor(m/1440)+" d"};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display="none",2800)}
const nm=id=>(D.pr[id]&&D.pr[id].name)||("usuario"+String(id).slice(-4));
const hasSt=u=>D.sto.some(s=>s.uid===u&&Date.now()-s.at<864e5);
const avp=id=>{const p=D.pr[id];return `<span class="av">${p&&p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(nm(id)[0].toUpperCase())}</span>`};
function av(id,noRing){const p=D.pr[id];const inner=p&&p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(nm(id)[0].toUpperCase());const a=`<span class="av" data-av="${esc(id)}">${inner}</span>`;return hasSt(id)&&!noRing?`<span class="rg">${a}</span>`:a}
function resize(file,max,q){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const i=new Image();i.onerror=ko;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};i.src=r.result};r.readAsDataURL(file)})}
const likeN=id=>Object.keys(D.lk).filter(k=>D.lk[k].pid===id).length;
const liked=id=>!!D.lk[id+"_"+uid];
async function toggleLike(id){if(!canW)return toast("Tu cuenta solo puede ver");const r=db.collection("likes").doc(id+"_"+uid);try{if(liked(id))await r.delete();else{await r.set({pid:id,uid});const p=findP(id);p&&nt(p.uid,"like",id)}}catch(e){toast("No se pudo guardar el me gusta")}}
async function add(type,extra){try{await db.collection("posts").add(Object.assign({type,uid,at:Date.now()},extra));return true}catch(e){toast(e.code==="quota_exceeded"?"Se llenó el almacenamiento de la app":"No se pudo publicar");return false}}
function sub(type,lim){db.collection("posts").where("type","==",type).orderBy("at","desc").limit(lim).onSnapshot(s=>{D[type]=s.docs.map(d=>Object.assign({id:d.id},d.data()));draw()},()=>toast("Error al leer datos"))}
function liveVideos(){if(!("IntersectionObserver"in window))return;const o=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video");if(!v)return;if(e.isIntersecting)v.play().catch(()=>{});else v.pause()}),{threshold:.7});document.querySelectorAll("#v-vid .vid").forEach(x=>o.observe(x))}
function dot(c){const i=Math.round(c.scrollLeft/(c.clientWidth||1)),n=c.nextElementSibling;if(n&&n.classList.contains("dots"))[...n.children].forEach((d,j)=>d.classList.toggle("on",j===i))}
document.addEventListener("scroll",e=>{if(e.target.classList&&e.target.classList.contains("car"))dot(e.target)},true);
function setH(id,h){const e=$(id),y=e.scrollTop,cs={};e.querySelectorAll("[data-car]").forEach(c=>{cs[c.dataset.car]=c.scrollLeft});e.innerHTML=h;e.scrollTop=y;e.querySelectorAll("[data-car]").forEach(c=>{if(cs[c.dataset.car]){c.scrollLeft=cs[c.dataset.car];dot(c)}})}
const pimgs=p=>p.imgs&&p.imgs.length?p.imgs:[p.img];
const car=(im,id)=>im.length<2?`<img class="ph" src="${esc(im[0])}" alt="Foto">`:`<div class="car" data-car="${esc(id)}">${im.map((u,i)=>`<img src="${esc(u)}" alt="Foto ${i+1} de ${im.length}">`).join("")}</div><div class="dots">${im.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`;
const lk=p=>`<button class="ib lk" data-id="${p.id}" aria-label="Me gusta"><span>${liked(p.id)?"❤️":"🤍"}</span>${likeN(p.id)}</button><button class="ib" data-open="${p.type}" data-id="${p.id}" aria-label="Comentarios"><span>💬</span>${D.cm.filter(c=>c.pid===p.id).length}</button>`;
const hd=p=>`<div class="hd">${av(p.uid)}<div><b data-pu="${esc(p.uid)}">${esc(nm(p.uid))}</b><br><small>${ago(p.at)}</small></div></div>`;
function items(u,t){let a=D[t].filter(p=>p.uid===u);if(u===uid)a=a.concat(D.mine.filter(p=>p.type===t&&p.uid===uid).map(p=>Object.assign({},p,{_priv:1})));return a.sort((x,y)=>y.at-x.at)}
const findP=id=>[...D.vid,...D.pho,...D.txt,...D.mine].find(p=>p.id===id);
function draw(){
 if(!uid)return;
 setH("v-vid",FV("vid").length?FV("vid").map(p=>`<div class="vid"><video src="${esc(p.src)}" loop playsinline muted preload="metadata"></video><div class="ov"><div style="display:flex;align-items:center;gap:8px">${av(p.uid)}<b data-pu="${esc(p.uid)}">@${esc(nm(p.uid))}</b></div><span>${esc(p.text||"")}</span></div><div class="side">${lk(p)}</div></div>`).join(""):'<div class="empty" style="color:#bbb;padding-top:30%">Aún no hay vídeos.<br>Toca ＋ para subir el primero.</div>');
 const byU={};D.sto.filter(s=>Date.now()-s.at<864e5).filter(s=>s.uid===uid||(D.fl[uid]||[]).includes(s.uid)).forEach(s=>byU[s.uid]=1);
 const sr=`<div class="logo">Chispa</div><div class="stories"><button class="st add" id="addst"><span class="rg">${av(uid,1)}</span>Tu story</button>${Object.keys(byU).map(u=>`<button class="st" data-u="${esc(u)}"><span class="rg">${av(u,1)}</span>${esc(nm(u).slice(0,10))}</button>`).join("")}</div>`;
 setH("v-pho",sr+(FV("pho").length?FV("pho").map(p=>`<div class="card">${hd(p)}${car(pimgs(p),p.id)}${p.text?`<p>${esc(p.text)}</p>`:""}<div class="act">${lk(p)}</div></div>`).join(""):'<div class="empty">Aún no hay fotos. Toca ＋ para compartir una.</div>'));
 setH("v-txt",'<div class="logo">Chispa</div>'+(FV("txt").length?FV("txt").map(p=>`<div class="card">${hd(p)}<p>${esc(p.text)}</p><div class="act">${lk(p)}</div></div>`).join(""):'<div class="empty">Aún no hay mensajes. Toca ＋ y escribe algo.</div>'));
 if(!(document.activeElement&&document.activeElement.id==="un"))prof();
 liveVideos();
 if(curList)renderList();if(cur&&$("cmx")){$("cmx").innerHTML=cmH(cur.id);const q=findP(cur.id);if(q)$("lkx").innerHTML=lk(q)}if(tab==="inb"&&!(document.activeElement&&document.activeElement.id==="min"))inb();
}
function prof(){
 const u=pu||uid,own=u===uid,mine=["vid","pho","txt"].reduce((n,t)=>n+items(u,t).length,0);
 const fo=(D.fl[u]||[]).length,fe=Object.keys(D.fl).filter(k=>(D.fl[k]||[]).includes(u)).length,isF=(D.fl[uid]||[]).includes(u);
 const lab={vid:"Vídeos",pho:"Fotos",txt:"Textos"};
 const L=items(u,ptab);
 const act=p=>own?`<div class="tact"><button class="mb" data-act="priv" data-id="${p.id}" aria-label="${p._priv?"Hacer público":"Hacer privado"}">${p._priv?"🌐":"🔒"}</button><button class="mb" data-act="del" data-id="${p.id}" aria-label="Eliminar">🗑</button></div>`:"";
 const chip=p=>p._priv?'<span class="chip">🔒 Privado</span>':"";
 let body;const lock=(D.pr[u]||{}).priv&&!own&&!isF;
 if(lock)body='<div class="empty">🔒 Cuenta privada.<br>Síguela para ver sus publicaciones.</div>';else if(!L.length)body=`<div class="empty">${own?"Aún no has publicado aquí.":"Sin publicaciones."}</div>`;
 else if(ptab==="txt")body=L.map(p=>`<div class="card">${chip(p)}<p>${esc(p.text)}</p><small style="color:var(--soft)">${ago(p.at)}</small><div class="act">${lk(p)}</div>${act(p)}</div>`).join("");
 else body='<div class="grid">'+L.map(p=>`<div class="tile" data-open="${ptab}" data-id="${p.id}">${ptab==="vid"?`<video src="${esc(p.src)}#t=0.1" muted preload="metadata" playsinline></video>`:`<img src="${esc(pimgs(p)[0])}" alt="">${pimgs(p).length>1?`<span class="chip" style="left:auto;right:6px">${pimgs(p).length} fotos</span>`:""}`}${chip(p)}${act(p)}</div>`).join("")+"</div>";

function syncRq(){D.rr.filter(x=>x.from===uid&&D.rq.some(r=>r.id===x.id)).forEach(async x=>{if(sy.has(x.id))return;sy.add(x.id);try{if(x.st==="ok"){const L=Object.assign({},D.ofl);L[uid]=[...new Set([...(D.fl[uid]||[]),x.to])];await db.doc("follows/"+ou).set({lists:L});nt(x.to,"fol")}await db.collection("reqs").doc(x.id).delete()}catch(e){sy.delete(x.id)}})}
function cmH(id){const c=D.cm.filter(x=>x.pid===id).sort((a,b)=>a.at-b.at);return c.length?c.map(x=>`<div class="lrow" style="align-items:flex-start">${avp(x.uid)}<div style="flex:1"><b data-pu="${esc(x.uid)}">${esc(nm(x.uid))}</b> <small style="color:var(--soft)">${ago(x.at)}</small><p style="font-size:15px;margin:2px 0;white-space:pre-wrap;word-break:break-word">${esc(x.text)}</p></div>${x.uid===uid?`<button class="ib" data-dc="${x.id}" aria-label="Borrar comentario">🗑</button>`:""}</div>`).join(""):'<div class="empty" style="padding:16px">Sé el primero en comentar.</div>'}
function openItem(t,id){const p=findP(id);if(!p)return;cur={t,id};
 const m=t==="vid"?`<video src="${esc(p.src)}" controls autoplay playsinline></video>`:t==="pho"?car(pimgs(p),"o"+id):"";
 $("sh").innerHTML=`<div class="hd">${avp(p.uid)}<b data-pu="${esc(p.uid)}">${esc(nm(p.uid))}</b></div>${m}${p.text?`<p style="margin:10px 0;font-size:16px;white-space:pre-wrap;word-break:break-word">${esc(p.text)}</p>`:""}<div class="act"><span id="lkx">${lk(p)}</span><button class="ib" data-sh="${id}"><span>📤</span>Enviar</button></div><h3 style="margin:10px 0 4px">Comentarios</h3><div id="cmx">${cmH(id)}</div><div class="row"><input id="cin" type="text" maxlength="200" placeholder="Escribe un comentario…" aria-label="Comentario" style="flex:1"><button class="btn" id="csd">Enviar</button></div>`;$("md").classList.add("on")}
function inb(){let h;
 if(chatU){const L=D.dm.filter(m=>(m.from===uid&&m.to===chatU)||(m.from===chatU&&m.to===uid)).sort((a,b)=>a.at-b.at);
  h=`<div class="page"><div class="row" style="margin:0"><button class="btn alt" data-ch="">←</button><b data-pu="${esc(chatU)}">${esc(nm(chatU))}</b></div><div style="margin:12px 0">${L.map(m=>{const me=m.from===uid,q=m.pid&&findP(m.pid);return `<div style="display:flex;justify-content:${me?"flex-end":"flex-start"};margin:6px 0"><div class="card" style="margin:0;padding:10px 14px;max-width:80%;${me?"background:var(--acc);color:#fff":""}">${q?`<button class="btn alt" data-open="${q.type}" data-id="${q.id}">📎 Publicación de ${esc(nm(q.uid))}</button>`:""}${m.text?`<p style="margin:0">${esc(m.text)}</p>`:""}</div></div>`}).join("")||'<div class="empty">Escribe el primer mensaje.</div>'}</div><div class="row"><input id="min" type="text" maxlength="500" placeholder="Mensaje…" aria-label="Mensaje" style="flex:1"><button class="btn" id="msd">Enviar</button></div></div>`}
 else{const tabs=`<div class="logo">Chispa</div><div class="page"><div class="tabs"><button class="${itab==="n"?"on":""}" data-it="n">Avisos</button><button class="${itab==="m"?"on":""}" data-it="m">Mensajes</button></div>`;
  if(itab==="n"){const tx={fol:"empezó a seguirte",like:"le gustó tu publicación",com:"comentó tu publicación",req:"quiere seguirte"};
   const rq=D.rq.filter(r=>r.to===uid&&!D.rr.some(x=>x.id===r.id));
   const N=D.nt.filter(n=>n.to===uid).sort((a,b)=>b.at-a.at).slice(0,50);
   h=tabs+rq.map(r=>`<div class="lrow">${avp(r.from)}<b data-pu="${esc(r.from)}">${esc(nm(r.from))}</b><button class="btn" data-rq="${r.id}" data-f="${esc(r.from)}" data-ok="1">Aceptar</button><button class="btn alt" data-rq="${r.id}" data-f="${esc(r.from)}" data-ok="0">Rechazar</button></div>`).join("")+(N.length?N.map(n=>{const q=n.pid&&findP(n.pid);return `<div class="lrow" ${q?`data-open="${q.type}" data-id="${q.id}" style="cursor:pointer"`:""}>${avp(n.from)}<span style="flex:1"><b>${esc(nm(n.from))}</b> ${tx[n.kind]||""} <small style="color:var(--soft)">· ${ago(n.at)}</small></span></div>`}).join(""):rq.length?"":'<div class="empty">Aún no tienes avisos.</div>')+"</div>"}
  else{const P={};D.dm.filter(m=>m.from===uid||m.to===uid).sort((a,b)=>a.at-b.at).forEach(m=>P[m.from===uid?m.to:m.from]=m);const ks=Object.keys(P).sort((a,b)=>P[b].at-P[a].at);
   h=tabs+(ks.length?ks.map(u=>`<div class="lrow" data-ch="${esc(u)}" style="cursor:pointer">${avp(u)}<span style="flex:1"><b>${esc(nm(u))}</b><br><small style="color:var(--soft)">${P[u].text?esc(P[u].text.slice(0,40)):"📎 Publicación"}</small></span></div>`).join(""):'<div class="empty">Sin mensajes.<br>Entra al perfil de alguien y pulsa ✉️.</div>')+"</div>"}}
 setH("v-inb",h);if(chatU){const v=$("v-inb");v.scrollTop=v.scrollHeight}}
document.addEventListener("click",async e=>{const T=e.target;let x;
 if(T.closest("#csd")){const i=$("cin"),t=i.value.trim(),p=cur&&findP(cur.id);if(!t||!p)return;if(!canW)return toast("Tu cuenta solo puede ver");try{await db.collection("comments").add({pid:p.id,uid,text:t,at:Date.now()});i.value="";nt(p.uid,"com",p.id)}catch(z){toast("No se pudo comentar")}return}
 if(x=T.closest("[data-dc]")){try{await db.collection("comments").doc(x.dataset.dc).delete()}catch(z){toast("No se pudo borrar")}return}
 if(x=T.closest("[data-sh]")){const f=D.fl[uid]||[];$("sh").innerHTML=`<h2>Enviar a…</h2>${f.length?f.map(id=>`<div class="lrow">${avp(id)}<b>${esc(nm(id))}</b><button class="btn" data-to="${esc(id)}" data-id="${x.dataset.sh}">Enviar</button></div>`).join(""):'<div class="empty">Sigue a alguien para poder enviarle cosas.</div>'}`;cur=null;return}
 if(x=T.closest("[data-to]")){try{await db.collection("dms").add({from:uid,to:x.dataset.to,pid:x.dataset.id,text:"",at:Date.now()});toast("Enviado");close()}catch(z){toast("No se pudo enviar")}return}
 if(x=T.closest("[data-dm]")){close();chatU=x.dataset.dm;itab="m";return go("inb")}
 if(x=T.closest("[data-ch]")){chatU=x.dataset.ch||null;return inb()}
 if(x=T.closest("[data-it]")){itab=x.dataset.it;return inb()}
 if(T.closest("#msd")){const i=$("min"),t=i.value.trim();if(!t||!canW)return;i.value="";try{await db.collection("dms").add({from:uid,to:chatU,text:t,at:Date.now()})}catch(z){toast("No se pudo enviar")}return}
 if(x=T.closest("[data-rq]")){try{await db.collection("reqres").doc(x.dataset.rq).set({from:x.dataset.f,to:uid,st:x.dataset.ok==="1"?"ok":"no"})}catch(z){toast("No se pudo responder")}return}
 if(T.closest("#set")){const P=D.pr[uid]||{};$("sh").innerHTML=`<h2>Ajustes</h2><label class="lrow"><input type="checkbox" id="ps1" style="width:24px;height:24px" ${P.priv?"checked":""}><span style="flex:1"><b>Cuenta privada</b><br><small style="color:var(--soft)">Solo te siguen quienes aceptes y solo ellos ven tus publicaciones.</small></span></label><label class="lrow"><input type="checkbox" id="ps2" style="width:24px;height:24px" ${P.nonot?"":"checked"}><span style="flex:1"><b>Recibir avisos</b><br><small style="color:var(--soft)">Seguidores, me gusta y comentarios.</small></span></label><div class="row"><button class="btn alt" id="ecc">Cerrar</button></div>`;$("md").classList.add("on");$("ecc").onclick=close}
});
document.addEventListener("change",async e=>{const i=e.target.id;if(i!=="ps1"&&i!=="ps2")return;try{await saveProf(i==="ps1"?{priv:e.target.checked}:{nonot:!e.target.checked});toast("Guardado")}catch(z){toast("No se pudo guardar")}});
let sb,rt;
const X=async p=>{const r=await p;if(r.error)throw r.error;return r};
const W=async p=>{await X(p);refresh()};
const MAP={comments:d=>({pid:d.pid,uid:d.uid,body:d.text}),dms:d=>({from_id:d.from,to_id:d.to,body:d.text||"",pid:d.pid||null}),notifs:d=>({to_id:d.to,from_id:d.from,kind:d.kind,pid:d.pid||null}),reqs:d=>({a:d.from,b:d.to}),posts:d=>({uid:d.uid,type:d.type,body:d.text||"",src:d.src||null,imgs:d.imgs||(d.img?[d.img]:null)}),likes:d=>({pid:d.pid,uid:d.uid})};
db={collection:n=>({add:d=>W(sb.from(n).insert(MAP[n](d))),doc:id=>({
 set:async d=>{if(n==="reqres"){if(d.st==="ok")await X(sb.from("follows").insert({a:d.from,b:d.to}));await W(sb.from("reqs").delete().eq("a",d.from).eq("b",d.to))}else await W(sb.from(n).insert(MAP[n](d)))},
 delete:()=>{const[p,u]=id.split("_");return W(n==="likes"?sb.from("likes").delete().eq("pid",p).eq("uid",u):sb.from(n).delete().eq("id",id))}})})};
assets={upload:async b=>{const n=uid+"/"+Date.now()+Math.random().toString(36).slice(2)+"."+((b.type||"image/jpeg").split("/")[1]||"bin").split(";")[0];await X(sb.storage.from("media").upload(n,b,{contentType:b.type||"image/jpeg"}));return{url:sb.storage.from("media").getPublicUrl(n).data.publicUrl}}};
async function refresh(){const q=t=>sb.from(t).select("*");
 const[P,O,L,C,F,Q,N,M]=await Promise.all([q("profiles"),sb.from("posts").select("*").order("ts",{ascending:false}).limit(300),q("likes"),q("comments"),q("follows"),q("reqs"),q("notifs"),q("dms")]);
 if(P.error)toast("Error al leer la base de datos");
 const T=r=>+new Date(r.ts);
 D.pr={};(P.data||[]).forEach(r=>D.pr[r.id]=r);
 const ps=(O.data||[]).map(r=>({id:r.id,type:r.type,uid:r.uid,at:T(r),text:r.body,src:r.src,imgs:r.imgs,img:r.imgs&&r.imgs[0],hidden:r.hidden}));
 ["vid","pho","txt","sto"].forEach(t=>D[t]=ps.filter(p=>p.type===t&&!p.hidden));D.mine=ps.filter(p=>p.hidden&&p.uid===uid);
 D.lk={};(L.data||[]).forEach(r=>D.lk[r.pid+"_"+r.uid]={pid:r.pid,uid:r.uid});
 D.cm=(C.data||[]).map(r=>({id:r.id,pid:r.pid,uid:r.uid,text:r.body,at:T(r)}));
 D.fl={};(F.data||[]).forEach(r=>(D.fl[r.a]=D.fl[r.a]||[]).push(r.b));
 D.rq=(Q.data||[]).map(r=>({id:r.a+"_"+r.b,from:r.a,to:r.b}));
 D.nt=(N.data||[]).map(r=>({id:r.id,to:r.to_id,from:r.from_id,kind:r.kind,pid:r.pid||"",at:T(r)}));
 D.dm=(M.data||[]).map(r=>({id:r.id,from:r.from_id,to:r.to_id,text:r.body,pid:r.pid||"",at:T(r)}));
 if(uid)draw()}
(async function init(){const gm=m=>{$("gmsg").textContent=m};
 if(!window.supabase)return gm("No se pudo cargar Supabase. Revisa tu conexión.");
 sb=supabase.createClient(SB_URL,SB_KEY);canW=true;
 sb.channel("chispa").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(rt);rt=setTimeout(refresh,300)}).subscribe();
 try{const ss=(await sb.auth.getSession()).data.session;if(ss)await start(ss.user.id);else showAuth("in");$("gate").style.display="none"}catch(e){gm("Error de conexión con Supabase.")}
})();
</script>
